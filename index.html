<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0A6CFF" />
    <title>Nexo — Sua empresa no digital</title>
    <script>
      // Aplica o tema antes do primeiro paint (evita piscar branco no modo escuro).
      try {
        var pref = (JSON.parse(localStorage.getItem("nexo-theme") || "{}").state || {}).preference || "system";
        var dark = pref === "dark" || (pref === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
